<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050309">
<meta name="color-scheme" content="dark">
<title>Нурайым ❤️ Кандай шарт болбосун, сени сүйөм</title>
<style>
:root { --ctrlH: 120px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }

html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: radial-gradient(ellipse at top, #2a0f3a 0%, #0b0714 60%, #030208 100%);
  color: #ffe6ef;
  font-family: Georgia, "Times New Roman", serif;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 3;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6));
}

/* ---------- Фон ---------- */
#nebula { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
#nebula i { position: absolute; border-radius: 50%; animation: drift 24s ease-in-out infinite alternate; }
#nebula i:nth-child(1) { width: 80vmax; height: 80vmax; left: -25vmax; top: -25vmax;
  background: radial-gradient(circle, rgba(255,47,143,.30), transparent 65%); }
#nebula i:nth-child(2) { width: 70vmax; height: 70vmax; right: -30vmax; top: 15vh;
  background: radial-gradient(circle, rgba(122,59,255,.28), transparent 65%); animation-duration: 30s; animation-delay: -9s; }
#nebula i:nth-child(3) { width: 65vmax; height: 65vmax; left: 5vw; bottom: -35vmax;
  background: radial-gradient(circle, rgba(255,138,77,.20), transparent 65%); animation-duration: 36s; animation-delay: -15s; }
@keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(7vw,5vh) scale(1.25); } }

#fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
#tint { position: fixed; inset: 0; pointer-events: none; z-index: 2; }

/* ---------- Баштапкы экран ---------- */
#intro {
  position: fixed; inset: 0; z-index: 12;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; text-align: center; padding: 24px;
  background: radial-gradient(ellipse at center, rgba(5,3,9,.30), rgba(5,3,9,.80));
  transition: opacity 1.4s ease, visibility 1.4s;
}
#intro.hide { opacity: 0; visibility: hidden; pointer-events: none; }
#intro .small { letter-spacing: .32em; color: #e8bfd7; font-size: 13px; text-transform: uppercase; opacity: .9; }
#intro .hint { color: #d79ab9; font: 14px/1.6 Arial, sans-serif; max-width: 300px; }
#beginBtn {
  font-size: 92px; line-height: 1; background: none; border: 0; cursor: pointer; padding: 10px;
  filter: drop-shadow(0 0 26px #ff347e);
  animation: beatCss 1.3s infinite;
}
@keyframes beatCss { 0%,100% { transform: scale(1); } 15% { transform: scale(1.17); } 30% { transform: scale(1); } 45% { transform: scale(1.1); } }
#intro h1 { margin: 0; font-style: italic; font-weight: 400; font-size: clamp(38px, 12vw, 64px); color: #fff0f7;
  text-shadow: 0 0 6px #fff, 0 0 16px #ff7eb8, 0 0 34px #ff2f8f, 0 0 64px #ff2f8f;
  animation: introGlow 2.6s ease-in-out infinite alternate; }
@keyframes introGlow { to { text-shadow: 0 0 4px #fff, 0 0 10px #ff7eb8, 0 0 42px #ff2f8f, 0 0 90px #b02bff; } }

/* ---------- Сахна ---------- */
#stage { position: fixed; inset: 0; z-index: 5; pointer-events: none; }

#title {
  position: absolute; left: 0; right: 0; margin: 0; padding: 0 16px; text-align: center;
  top: calc(env(safe-area-inset-top, 0px) + 58px);
  font-weight: 400; font-style: italic; line-height: 1.15;
  font-size: clamp(30px, 9vw, 54px); color: #fff0f7;
}
#title.big { font-size: clamp(48px, 16vw, 92px); top: calc(env(safe-area-inset-top, 0px) + 50px); }
#title .ch {
  display: inline-block; opacity: 0;
  text-shadow: 0 0 6px #fff, 0 0 14px #ff7eb8, 0 0 28px #ff2f8f, 0 0 52px #ff2f8f;
  animation: neonOn 1.1s var(--d) both, neonPulse 3.4s calc(var(--d) + 1.2s) infinite alternate ease-in-out;
}
@keyframes neonOn { 0% { opacity: 0; } 8% { opacity: .9; } 12% { opacity: .15; } 22% { opacity: 1; } 30% { opacity: .25; } 42% { opacity: 1; } 100% { opacity: 1; } }
@keyframes neonPulse {
  from { text-shadow: 0 0 6px #fff, 0 0 14px #ff7eb8, 0 0 28px #ff2f8f, 0 0 52px #ff2f8f; }
  to   { text-shadow: 0 0 4px #fff, 0 0 10px #ff7eb8, 0 0 38px #ff2f8f, 0 0 84px #b02bff; }
}

#card {
  position: absolute; left: 50%; transform: translateX(-50%);
  width: min(92vw, 620px);
  bottom: calc(var(--ctrlH) + 8px);
  max-height: calc(100vh - var(--ctrlH) - 200px);
  max-height: calc(100dvh - var(--ctrlH) - 200px);
  overflow-y: auto; pointer-events: auto;
  padding: 16px 18px; border-radius: 22px;
  background: rgba(16, 6, 26, .55);
  border: 1px solid rgba(255,143,189,.35);
  box-shadow: 0 0 40px rgba(230,55,124,.2), inset 0 0 30px rgba(255,255,255,.03);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  text-align: left; -webkit-user-select: text; user-select: text;
}
#text { margin: 0; font-size: clamp(16px, 4.4vw, 20px); line-height: 1.75; color: #ffe9f2; }
#text .sent { display: block; margin-bottom: .55em; opacity: 0; animation: sentIn 1.4s ease both; }
#text .sent:last-child { margin-bottom: 0; }
@keyframes sentIn {
  from { opacity: 0; transform: translateY(16px); filter: blur(8px); }
  to   { opacity: 1; transform: none; filter: blur(0); }
}

#topbar {
  position: fixed; left: 0; right: 0; z-index: 9;
  top: calc(env(safe-area-inset-top, 0px) + 8px);
  display: flex; justify-content: center; align-items: center; gap: 0;
}
.dot { width: 24px; height: 24px; padding: 0; border: 0; background: none; position: relative; cursor: pointer; }
.dot::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; border: 1px solid #ff8fbd; transition: all .5s; }
.dot.on::before { background: #ff8fbd; box-shadow: 0 0 12px #ff438f; transform: scale(1.45); }

/* ---------- Башкаруу ---------- */
#controls {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
  padding: 10px 10px calc(env(safe-area-inset-bottom, 0px) + 10px);
  background: linear-gradient(to top, rgba(5,3,9,.94), rgba(5,3,9,.6) 70%, transparent);
  display: flex; flex-direction: column; gap: 6px; align-items: center;
}
.row { display: flex; gap: 6px; justify-content: center; width: 100%; max-width: 620px; }
#controls button {
  flex: 1 1 0; min-width: 0; padding: 11px 4px;
  font: 13.5px Arial, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: #fff; cursor: pointer; border-radius: 22px;
  border: 1px solid rgba(255,143,189,.5);
  background: linear-gradient(120deg, rgba(140,34,90,.85), rgba(81,32,111,.85));
  transition: transform .15s, box-shadow .3s;
}
#controls button:active { transform: scale(.94); }
#controls button.active { box-shadow: 0 0 16px #ff438f; background: linear-gradient(120deg, #c2306f, #7a2fa8); }
#controls button.small { flex: 0 0 52px; }

#more {
  display: none; width: 100%; max-width: 620px; flex-direction: column; gap: 9px;
  padding: 12px; border-radius: 16px; max-height: 42vh; overflow-y: auto;
  background: rgba(20,8,32,.9); border: 1px solid rgba(255,143,189,.3);
}
#more.open { display: flex; }
#more label { display: flex; flex-direction: column; gap: 4px; font: 13px Arial, sans-serif; color: #f4dce9; }
#more input[type=range] { width: 100%; accent-color: #ff5c9d; }
#more button { flex: none !important; width: 100%; }

#veil { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 7; transition: opacity .75s ease; }
#veil.on { opacity: 1; }

#toast {
  position: fixed; left: 50%; z-index: 14; pointer-events: none;
  top: calc(env(safe-area-inset-top, 0px) + 40px);
  transform: translate(-50%, -10px); opacity: 0; transition: all .4s;
  max-width: 90vw; padding: 10px 14px; border-radius: 14px; text-align: center;
  font: 14px/1.5 Arial, sans-serif; color: #ffe6ef;
  background: rgba(20,8,32,.94); border: 1px solid rgba(255,143,189,.5);
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

.pop { position: fixed; z-index: 6; pointer-events: none; animation: pop 1.6s ease-out forwards; }
@keyframes pop {
  from { opacity: 1; transform: translate(0,0) scale(.6); }
  to   { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.5) rotate(var(--rot)); }
}
</style>

<body>

<div id="nebula"><i></i><i></i><i></i></div>

<!-- Баштапкы экран: музыка жана үн колдонуучунун басканынан кийин башталат -->
<section id="intro">
  <div class="small">Нурайым үчүн</div>

</section>

    <label>🐢 Окуу ылдамдыгы <input type="range" id="voiceRate" min="60" max="120" value="82"></label>
    <button id="langBtn">🗣 Окуу тили</button>
    <button id="voiceFileBtn">🎧 Өз үнүмдү кошом</button>
    <button id="musicFileBtn">🎼 Өз музыкамды кошом</button>
    <button id="fsBtn">⛶ Толук экран</button>
    <input type="file" id="voiceFile" accept="audio/*" hidden>
    <input type="file" id="musicFile" accept="audio/*" hidden>
  </div>
</nav>

<div id="toast"></div>

<script>
"use strict";
(function () {

/* =====================================================
   ЖӨНӨКӨЙ КӨМӨКЧҮЛӨР
   ===================================================== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rnd = (a, b) => a + Math.random() * (b - a);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const TAU = Math.PI * 2;
const LOW = (navigator.hardwareConcurrency || 4) <= 4;

const store = {
  get(k, d) { try { const v = localStorage.getItem("nur_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("nur_" + k, JSON.stringify(v)); } catch (e) {} }
};

let toastTimer;
function toast(msg, ms) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), ms || 5000);
}

function stripEmoji(s) {
  return s.replace(/[\u2600-\u27BF\uFE0F\u200D]|[\uD83C-\uDBFF][\uDC00-\uDFFF]/g, "").replace(/\s+/g, " ").trim();
}
function splitSentences(text) {
  return (text.match(/[^.!?…]+(?:[.!?…]+|$)/g) || [text]).map(s => s.trim()).filter(Boolean);
}

/* =====================================================
   САХНАЛАР (тексттер)
   ===================================================== */
const SCENES = [
  { title: "Нурайымым ❤️",
    text: "Бул дүйнөдө көп нерсе өзгөрүшү мүмкүн... Бирок сага болгон сезимимди чын жүрөгүмдөн сактагым келет." },
  { title: "Кубанычыңда",
    text: "Сен бактылуу болгондо, сенин жылмаюуңду көрүп мен да кубангым келет. Жакшы күндөрүңдү чогуу бөлүшкүм келет." },
  { title: "Кыйын күндөрүңдө",
    text: "Кээде жашоо оор болушу мүмкүн. Ошондой күндөрү сени угуп, түшүнүп, колуман келишинче жаныңда болгум келет. Баарын жалгыз көтөрүшүңдү каалабайм." },
  { title: "Алыста болсок да",
    text: "Аралык бизди бөлүп турса да, сен мен үчүн кымбат адам бойдон каласың. Сени эстеп, үнүңдү угуп, бир күнү кайра көрүшүүнү күткүм келет." },
  { title: "Кемчиликтерибиз менен",
    text: "Мен идеалдуу эмесмин, сен да идеалдуу болушуң керек эмес. Мен үчүн маанилүүсү — бири-бирибизди угуу, сыйлоо, кечирим сурай билүү жана мамилебизди чогуу бекемдөө." },
  { title: "Менин каалоом",
    text: "Нурайымым, келечекте жакшы күндөрдү чогуу өткөрүп, кыйынчылыктарды бирге жеңип, бири-бирибизге ишенимдүү адамдардан болсок дейм. Сага болгон сүйүүмдү сөз менен гана эмес, күн сайын мамилем менен да көрсөткүм келет." },
  { title: "Акыркы сөзүм сага...",
    text: "Нурайым, сен мен үчүн өзгөчө адамсың. Кандай күндөр келбесин, сага болгон сезимимди баалап, сени угуп, сыйлап, сүйүүгө аракет кылам. Сени чын жүрөгүмдөн жакшы көрөм. ❤️" }
];
const N = SCENES.length;

const TINTS = [
  "radial-gradient(ellipse at 50% 35%, rgba(255,40,120,.14), transparent 60%)",
  "radial-gradient(ellipse at 80% 10%, rgba(255,170,60,.24), transparent 62%)",
  "linear-gradient(to bottom, rgba(20,30,90,.38), transparent 80%)",
  "radial-gradient(ellipse at 50% 30%, rgba(90,120,255,.18), transparent 66%)",
  "radial-gradient(ellipse at 50% 40%, rgba(180,60,255,.20), transparent 62%)",
  "linear-gradient(to top, rgba(255,110,120,.18), transparent 60%)",
  "radial-gradient(ellipse at 50% 38%, rgba(255,60,140,.24), transparent 62%)"
];

const S = { started: false, idx: 0, busy: false, shown: false };

/* =====================================================
   ҮН ДВИЖОГУ (Web Audio) — музыка тышкы файлсыз да иштейт
   ===================================================== */
let actx = null, master = null, musicGain = null;

function ensureCtx() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    actx = new AC();
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 4;
    master = actx.createGain(); master.gain.value = 0.9;
    master.connect(comp); comp.connect(actx.destination);

    // жумшак жаңырык (reverb)
    const len = Math.floor(actx.sampleRate * 2.8);
    const buf = actx.createBuffer(2, len, actx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4);
    }
    const conv = actx.createConvolver(); conv.buffer = buf;
    const wet = actx.createGain(); wet.gain.value = 0.38;
    conv.connect(wet); wet.connect(master);

    musicGain = actx.createGain(); musicGain.gain.value = 0;
    musicGain.connect(master); musicGain.connect(conv);
  }
  if (actx.state === "suspended") actx.resume();
  return true;
}

function piano(freq, t, dur, vol) {
  const gn = actx.createGain();
  const lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2800;
  const o1 = actx.createOscillator(); o1.type = "triangle"; o1.frequency.value = freq;
  const o2 = actx.createOscillator(); o2.type = "sine"; o2.frequency.value = freq * 2;
  const g2 = actx.createGain(); g2.gain.value = 0.25;
  o1.connect(gn); o2.connect(g2); g2.connect(gn);
  gn.connect(lp); lp.connect(musicGain);
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o1.start(t); o2.start(t); o1.stop(t + dur + 0.1); o2.stop(t + dur + 0.1);
}

function strings(freqs, t, dur) {
  freqs.forEach(f => {
    [-6, 6].forEach(det => {
      const o = actx.createOscillator(); o.type = "sawtooth"; o.frequency.value = f; o.detune.value = det;
      const lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900; lp.Q.value = 0.5;
      const gn = actx.createGain();
      gn.gain.setValueAtTime(0.0001, t);
      gn.gain.linearRampToValueAtTime(0.022, t + dur * 0.35);
      gn.gain.linearRampToValueAtTime(0.018, t + dur * 0.8);
      gn.gain.linearRampToValueAtTime(0.0001, t + dur + 0.6);
      o.connect(lp); lp.connect(gn); gn.connect(musicGain);
      o.start(t); o.stop(t + dur + 0.7);
    });
  });
}

/* Am – F – C – G – Am – F – Dm – E */
const CH = [
  [220.00, 261.63, 329.63, 440.00],
  [174.61, 220.00, 261.63, 349.23],
  [261.63, 329.63, 392.00, 523.25],
  [196.00, 246.94, 293.66, 392.00],
  [220.00, 261.63, 329.63, 440.00],
  [174.61, 220.00, 261.63, 349.23],
  [146.83, 220.00, 293.66, 349.23],
  [164.81, 246.94, 329.63, 415.30]
];
const BASS = [110.00, 87.31, 130.81, 98.00, 110.00, 87.31, 73.42, 82.41];
const MEL = [
  [659.25,0,0,0,523.25,0,587.33,0],
  [698.46,0,0,0,880.00,0,698.46,0],
  [783.99,0,0,0,659.25,0,523.25,0],
  [587.33,0,0,0,783.99,0,587.33,0],
  [659.25,0,0,0,880.00,0,659.25,0],
  [698.46,0,0,0,880.00,0,1046.5,0],
  [880.00,0,0,0,698.46,0,587.33,0],
  [830.61,0,0,0,659.25,0,493.88,0]
];
const PAT = [0, 1, 2, 3, 2, 1, 2, 3];
const STEP = 0.5;

function probe(src, evt, cb) {
  try {
    const a = new Audio();
    a.preload = "auto";
    a.addEventListener(evt, () => cb(a), { once: true });
    a.addEventListener("error", () => {}, { once: true });
    a.src = src; a.load();
  } catch (e) {}
}

/* ---------- МУЗЫКА ---------- */
const Music = {
  on: false, vol: store.get("mvol", 0.6), duck: 1,
  fileAudio: null, usingFile: false, userFileURL: null, warned: false,
  sched: null, step: 0, next: 0,

  level() { return this.vol * this.duck; },

  apply() {
    const L = this.level();
    if (musicGain && actx) musicGain.gain.setTargetAtTime(this.on && !this.usingFile ? L * 0.9 : 0, actx.currentTime, 0.25);
    if (this.fileAudio) this.fileAudio.volume = clamp(this.on && this.usingFile ? L : 0, 0, 1);
  },

  startSynth() {
    if (!ensureCtx()) { toast("Бул браузер музыка жаратууну колдобойт. ⚙️ аркылуу өз музыкаңды кош."); return; }
    this.on = true; this.usingFile = false;
    this.step = 0; this.next = actx.currentTime + 0.15;
    clearInterval(this.sched);
    this.sched = setInterval(() => this.tick(), 100);
    this.apply(); refreshUI();
  },

  start() {
    if (this.on) return;
    if (this.fileAudio) {
      this.usingFile = true; this.on = true;
      this.fileAudio.loop = true;
      this.fileAudio.volume = clamp(this.level(), 0, 1);
      const pr = this.fileAudio.play();
      if (pr && pr.catch) pr.catch(() => {
        this.usingFile = false; this.on = false;
        toast("Музыка файлы ойной алган жок, ички музыка колдонулат.");
        this.startSynth();
      });
      refreshUI();
    } else {
      this.startSynth();
      if (!this.warned) {
        this.warned = true;
        toast("romantic-music.mp3 файлы табылган жок, ошондуктан ички романтикалык музыка ойноп жатат. Өз музыкаңды ⚙️ аркылуу кошсоң болот.", 8000);
      }
    }
  },

  stop() {
    this.on = false;
    this.apply();
    if (this.fileAudio && this.usingFile) this.fileAudio.pause();
    setTimeout(() => { if (!this.on) clearInterval(this.sched); }, 1500);
    refreshUI();
  },

  toggle() { this.on ? this.stop() : this.start(); },

  tick() {
    if (!actx || !this.on || this.usingFile) return;
    while (this.next < actx.currentTime + 0.4) {
      this.play(this.step, this.next);
      this.next += STEP; this.step++;
    }
  },

  play(s, t) {
    const bar = Math.floor(s / 8) % 8, pos = s % 8, ch = CH[bar];
    if (pos === 0) {
      piano(BASS[bar], t, 3.8, 0.2);
      strings([ch[0], ch[1], ch[2]], t, STEP * 8);
    }
    piano(ch[PAT[pos]], t, 1.8, 0.1);
    const m = MEL[bar][pos];
    if (m) piano(m, t, 3.0, 0.12);
  },

  useUserFile(file) {
    if (this.userFileURL) URL.revokeObjectURL(this.userFileURL);
    this.userFileURL = URL.createObjectURL(file);
    const a = new Audio(this.userFileURL); a.loop = true; a.preload = "auto";
    if (this.on) this.stop();
    if (this.fileAudio) this.fileAudio.pause();
    this.fileAudio = a; this.warned = true;
    toast("🎼 Музыка файлы кошулду: " + file.name);
    this.start();
  },

  detach() {
    const wasOn = this.on;
    if (this.on) this.stop();
    if (this.fileAudio) this.fileAudio.pause();
    this.fileAudio = null; this.usingFile = false;
    toast("Музыка файлы алынды, ички музыка колдонулат.");
    if (wasOn) setTimeout(() => this.start(), 200);
    refreshUI();
  }
};

/* ---------- ҮН (кат окуу) ---------- */
function computeBounds() {
  const lens = SCENES.map(s => stripEmoji(s.title).length + s.text.length);
  const total = lens.reduce((a, b) => a + b, 0);
  let acc = 0;
  return lens.map(l => { const b = acc / total; acc += l; return b; });
}

const Voice = {
  reading: false, token: 0, cur: null,
  fileAudio: null, userFile: false, warned: false,
  vol: store.get("vvol", 1), rate: store.get("vrate", 0.82), lang: store.get("vlang", "ky-KG"),
  bounds: computeBounds(),

  getVoice() {
    if (!("speechSynthesis" in window)) return null;
    const want = this.lang.toLowerCase().slice(0, 2);
    const vs = speechSynthesis.getVoices() || [];
    const c = vs.filter(v => v.lang.toLowerCase().replace("_", "-").startsWith(want));
    if (!c.length) return null;
    return c.find(v => /male|erkek/i.test(v.name) && !/female/i.test(v.name)) || c[0];
  },

  attach(a, isUser) {
    this.fileAudio = a; this.userFile = isUser;
    a.preload = "auto";
    a.ontimeupdate = () => this.onTime();
    a.onended = () => this.finish(true);
    refreshUI();
  },

  detach() {
    this.stop();
    this.fileAudio = null; this.userFile = false;
    refreshUI();
  },

  onTime() {
    const a = this.fileAudio;
    if (!a || !this.reading) return;
    const d = a.duration;
    if (!isFinite(d) || d <= 0) return;
    const f = a.currentTime / d;
    let idx = 0;
    for (let k = 0; k < N; k++) if (f >= this.bounds[k]) idx = k;
    if (idx !== S.idx && !S.busy) go(idx, { fromVoice: true });
  },

  seekTo(i) {
    const a = this.fileAudio; if (!a) return;
    const d = a.duration;
    try { a.currentTime = (isFinite(d) && d > 0) ? this.bounds[i] * d : 0; } catch (e) {}
  },

  finish(done) {
    this.reading = false;
    Music.duck = 1; Music.apply();
    refreshUI();
    if (done) toast("Кат бүттү ❤️", 3500);
  },

  stop() {
    this.token++;
    this.reading = false;
    try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch (e) {}
    if (this.fileAudio) this.fileAudio.pause();
    Music.duck = 1; Music.apply();
    refreshUI();
  },

  start(i) {
    this.stop();
    this.reading = true;
    const tk = ++this.token;
    Music.duck = 0.3; Music.apply();
    refreshUI();

    if (this.fileAudio) {
      const a = this.fileAudio;
      a.volume = clamp(this.vol, 0, 1);
      this.seekTo(i);
      const pr = a.play();
      if (pr && pr.catch) pr.catch(() => { toast("Аудио файл ойной алган жок."); this.finish(false); });
      return;
    }

    if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined") {
      toast("Бул браузерде үн менен окуу колдоого алынбайт. ⚙️ аркылуу өз үн файлыңды кош.", 8000);
      this.finish(false);
      return;
    }

    const v = this.getVoice();
    if (!v && !this.warned) {
      this.warned = true;
      toast("Телефондо " + (this.lang === "ky-KG" ? "кыргызча" : "орусча") +
        " үн табылган жок, сөздөр туура айтылбашы мүмкүн. Эң жакшысы — ⚙️ аркылуу өз үнүңдү кошуу 🎧", 9000);
    }
    const sc = SCENES[i];
    const parts = [stripEmoji(sc.title) + "."].concat(splitSentences(sc.text));
    setTimeout(() => { if (tk === this.token) this.queue(parts, 0, tk, i, v); }, 150);
  },

  queue(parts, k, tk, i, v) {
    if (tk !== this.token) return;
    if (k >= parts.length) { this.sceneDone(i, tk); return; }
    const text = stripEmoji(parts[k]);
    if (!text) { this.queue(parts, k + 1, tk, i, v); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = this.lang;
    if (v) u.voice = v;
    u.rate = this.rate; u.pitch = 0.75; u.volume = this.vol;
    u.onend = () => this.queue(parts, k + 1, tk, i, v);
    u.onerror = e => {
      if (tk !== this.token) return;
      if (e.error === "interrupted" || e.error === "canceled") return;
      toast("Үн иштеген жок (" + e.error + "). ⚙️ аркылуу өз үн файлыңды кошуп көр.", 7000);
      this.finish(false);
    };
    this.cur = u;                    // сакталат, болбосо браузер өчүрүп салышы мүмкүн
    speechSynthesis.speak(u);
  },

  sceneDone(i, tk) {
    if (tk !== this.token) return;
    if (i >= N - 1) { this.finish(true); return; }
    setTimeout(() => { if (tk === this.token) go(i + 1); }, 1400);
  }
};
if ("speechSynthesis" in window) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (e) {} }

const titleEl = $("title"), textEl = $("text"), veil = $("veil");

function buildDots() {
  const bar = $("topbar");
  for (let i = 0; i < N; i++) {
    const d = document.createElement("button");
    d.className = "dot"; d.setAttribute("aria-label", "Сахна " + (i + 1));
    d.addEventListener("click", () => go(i));
    bar.appendChild(d);
  }
}

function renderScene(i) {
  const sc = SCENES[i];
  titleEl.innerHTML = "";
  Array.from(sc.title).forEach((ch, k) => {
    const s = document.createElement("span");
    s.className = "ch";
    s.textContent = ch === " " ? "\u00A0" : ch;
    s.style.setProperty("--d", (0.25 + k * 0.13).toFixed(2) + "s");
    titleEl.appendChild(s);
  });
  titleEl.classList.toggle("big", i === 0);

  textEl.innerHTML = "";
  splitSentences(sc.text).forEach((p, k) => {
    const s = document.createElement("span");
    s.className = "sent"; s.textContent = p;
    s.style.animationDelay = (1.3 + k * 1.6).toFixed(2) + "s";
    textEl.appendChild(s);
  });
  $("card").scrollTop = 0;

  document.querySelectorAll(".dot").forEach((d, k) => d.classList.toggle("on", k === i));
  $("nextBtn").textContent = i === N - 1 ? "↺ Башынан" : "Алдыга ›";
}

async function go(i, opts) {
  opts = opts || {};
  if (S.busy) return;
  i = ((i % N) + N) % N;
  if (i === S.idx && S.shown && !opts.force) return;
  S.busy = true;
  veil.classList.add("on");
  await sleep(780);
  S.idx = i; S.shown = true;
  renderScene(i);
  setEffect(i);
  veil.classList.remove("on");
  await sleep(300);
  S.busy = false;
  if (Voice.reading && !opts.fromVoice) {
    if (Voice.fileAudio) Voice.seekTo(i); else Voice.start(i);
  }
}
const waitIdle = async () => { while (S.busy) await sleep(80); };

/* =====================================================
   КАНВАС ЭФФЕКТТЕРИ
   ===================================================== */
const cv = $("fx"), g = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
let stars = [], petals = [], rings = [], shooters = [];
let cur = 0, sceneStart = performance.now();
const sprites = { heart: [], petal: [] };

/* --- жүрөк геометриясы --- */
function hx(t) { const s = Math.sin(t); return 16 * s * s * s; }
function hy(t) { return -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) - 2.5; }
function heartPath(c, cx, cy, k, steps) {
  steps = steps || 64;
  c.beginPath();
  for (let i = 0; i <= steps; i++) {
    const t = i / steps * TAU, x = cx + hx(t) * k, y = cy + hy(t) * k;
    if (i) c.lineTo(x, y); else c.moveTo(x, y);
  }
  c.closePath();
}
function beatCurve(t, period) {
  const ph = (t % period) / period;
  return Math.pow(Math.max(0, Math.cos(ph * TAU)), 8) * 0.9 + Math.pow(Math.max(0, Math.cos((ph - 0.22) * TAU)), 8) * 0.55;
}
function glow(x, y, r, rgb, a) {
  if (a <= 0.003) return;
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, "rgba(" + rgb + "," + a + ")");
  gr.addColorStop(1, "rgba(" + rgb + ",0)");
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
}

/* --- спрайттар --- */
function makeHeartSprite(c1, c2) {
  const s = document.createElement("canvas"); s.width = s.height = 64;
  const c = s.getContext("2d");
  const gr = c.createLinearGradient(0, 8, 0, 56);
  gr.addColorStop(0, c1); gr.addColorStop(1, c2);
  c.shadowColor = c1; c.shadowBlur = 8;
  c.fillStyle = gr; heartPath(c, 32, 32, 1.65, 48); c.fill();
  return s;
}
function makePetalSprite(c1, c2) {
  const s = document.createElement("canvas"); s.width = 40; s.height = 50;
  const c = s.getContext("2d");
  const gr = c.createRadialGradient(20, 30, 3, 20, 25, 27);
  gr.addColorStop(0, c1); gr.addColorStop(1, c2);
  c.fillStyle = gr;
  c.beginPath(); c.moveTo(20, 3);
  c.bezierCurveTo(41, 10, 38, 38, 20, 47);
  c.bezierCurveTo(2, 38, -1, 10, 20, 3); c.fill();
  c.strokeStyle = "rgba(255,255,255,.22)"; c.lineWidth = 1;
  c.beginPath(); c.moveTo(20, 8); c.quadraticCurveTo(22, 26, 20, 42); c.stroke();
  return s;
}
function buildSprites() {
  [["#ff7eb8", "#e0206f"], ["#ff4d6d", "#b0123f"], ["#ffe08a", "#ff9a3c"], ["#d59bff", "#7a3bff"]]
    .forEach(p => sprites.heart.push(makeHeartSprite(p[0], p[1])));
  [["#ff7aa8", "#c2185b"], ["#ff4d6d", "#8e0b33"], ["#ffb3cf", "#e0407a"]]
    .forEach(p => sprites.petal.push(makePetalSprite(p[0], p[1])));
}

/* --- жылдыздар --- */
function initStars() {
  const n = Math.min(LOW ? 110 : 200, Math.floor(W * H / 3200));
  stars = Array.from({ length: n }, () => ({
    x: Math.random() * W, y: Math.random() * H, r: rnd(.3, 1.5), ph: rnd(0, TAU), sp: rnd(.5, 2),
    c: Math.random() > .65 ? "255,181,219" : (Math.random() > .7 ? "255,224,160" : "255,255,255")
  }));
}
function drawStars(t, alpha) {
  for (const s of stars) {
    const a = (.3 + .7 * Math.abs(Math.sin(t * s.sp + s.ph))) * alpha;
    g.fillStyle = "rgba(" + s.c + "," + a.toFixed(3) + ")";
    g.fillRect(s.x, s.y, s.r * 1.6, s.r * 1.6);
  }
}

/* --- роза жалбырактары --- */
function newPetal(init) {
  return { x: rnd(-20, W + 20), y: init ? rnd(-30, H) : rnd(-70, -20), vy: rnd(28, 70), sway: rnd(10, 40),
    sw: rnd(.6, 1.6), ph: rnd(0, TAU), rot: rnd(0, TAU), vr: rnd(-1.4, 1.4), sz: rnd(14, 30),
    fl: rnd(0, TAU), fs: rnd(1.5, 3.5), spr: (Math.random() * 3) | 0, a: rnd(.55, .95) };
}
function initPetals() {
  const n = LOW ? 55 : 100;
  petals = Array.from({ length: n }, () => newPetal(true));
}
function updatePetals(dt, t) {
  for (const p of petals) {
    p.y += p.vy * dt;
    p.x += (Math.sin(t * p.sw + p.ph) * p.sway + 8) * dt;
    p.rot += p.vr * dt; p.fl += p.fs * dt;
    if (p.y > H + 40 || p.x > W + 60) Object.assign(p, newPetal(false));
  }
}
function drawPetals() {
  for (const p of petals) {
    const c = Math.cos(p.rot), s = Math.sin(p.rot), sx = .25 + .75 * Math.abs(Math.cos(p.fl));
    g.setTransform(DPR * c * sx, DPR * s * sx, -DPR * s, DPR * c, DPR * p.x, DPR * p.y);
    g.globalAlpha = p.a;
    const w = p.sz * .8, h = p.sz;
    g.drawImage(sprites.petal[p.spr], -w / 2, -h / 2, w, h);
  }
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.globalAlpha = 1;
}

/* --- жарык толкундары --- */
function spawnRing(x, y, r0, r1, gold) {
  rings.push({ x, y, r0, r1, t: 0, life: 2.6, gold });
  if (rings.length > 14) rings.shift();
}
function drawRings(dt) {
  g.globalCompositeOperation = "lighter";
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.t += dt;
    const u = r.t / r.life;
    if (u >= 1) { rings.splice(i, 1); continue; }
    const rad = lerp(r.r0, r.r1, 1 - Math.pow(1 - u, 2));
    const a = (1 - u) * .5;
    g.lineWidth = 2 + (1 - u) * 4;
    g.strokeStyle = r.gold ? "rgba(255,200,110," + a + ")" : "rgba(255,92,157," + a + ")";
    g.beginPath(); g.arc(r.x, r.y, rad, 0, TAU); g.stroke();
  }
  g.globalCompositeOperation = "source-over";
}

/* --- учуп өткөн жылдыздар --- */
function shoot(dt, chance) {
  if (Math.random() < chance * dt * 60)
    shooters.push({ x: rnd(0, W), y: rnd(0, H * .35), vx: rnd(380, 560), vy: rnd(180, 300), life: 1 });
  g.globalCompositeOperation = "lighter";
  for (let i = shooters.length - 1; i >= 0; i--) {
    const s = shooters[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt * .9;
    if (s.life <= 0) { shooters.splice(i, 1); continue; }
    const tl = .09;
    const gr = g.createLinearGradient(s.x, s.y, s.x - s.vx * tl, s.y - s.vy * tl);
    gr.addColorStop(0, "rgba(255,230,245," + s.life + ")");
    gr.addColorStop(1, "rgba(255,230,245,0)");
    g.strokeStyle = gr; g.lineWidth = 2;
    g.beginPath(); g.moveTo(s.x, s.y); g.lineTo(s.x - s.vx * tl, s.y - s.vy * tl); g.stroke();
  }
  g.globalCompositeOperation = "source-over";
}

/* --- жаркыраган жүрөк --- */
const PINK = { rgb: "255,92,157", h1: "#ff8fbd", h2: "#d81b60" };
const GOLD = { rgb: "255,200,110", h1: "#ffe8a0", h2: "#ff9a3c" };
const BIG  = { rgb: "255,110,160", h1: "#ffd27a", h2: "#ff3d8b" };
function glowHeart(x, y, k, col, alpha) {
  if (alpha <= 0.01) return;
  g.globalCompositeOperation = "lighter";
  glow(x, y, k * 28, col.rgb, .38 * alpha);
  g.globalCompositeOperation = "source-over";
  g.globalAlpha = alpha;
  const gr = g.createLinearGradient(x, y - 15 * k, x, y + 15 * k);
  gr.addColorStop(0, col.h1); gr.addColorStop(1, col.h2);
  g.fillStyle = gr; heartPath(g, x, y, k, 56); g.fill();
  g.lineWidth = 2; g.strokeStyle = "rgba(255,255,255,.55)"; g.stroke();
  g.globalAlpha = 1;
}

/* =====================================================
   7 САХНАНЫН ЭФФЕКТИ
   ===================================================== */
const FX = [

/* 0 — Караңгыдан жаркыраган 3D жүрөк */
{
  pts: [], lastBeat: -1,
  init() {
    const n = LOW ? 520 : 860; this.pts = [];
    for (let i = 0; i < n; i++) {
      const outline = Math.random() < .35;
      const t = rnd(0, TAU);
      const k = outline ? rnd(.96, 1.02) : Math.sqrt(Math.random());
      const depth = outline ? 2.5 : 9 * Math.sqrt(Math.max(0, 1 - k * k)) + 2;
      this.pts.push({ x: hx(t) * k, y: hy(t) * k, z: rnd(-1, 1) * depth, s: rnd(.9, 2.4) });
    }
    this.lastBeat = -1;
  },
  fg(st, t, dt) {
    const K = Math.min(W, H * .62) * .019, cx = W / 2, cy = H * .40;
    const appear = S.started ? smooth(.3, 3.2, st) : .3;
    const b = beatCurve(st, 1.3), scale = K * (1 + .09 * b);
    const ang = Math.sin(st * .55) * .85, ca = Math.cos(ang), sa = Math.sin(ang);
    g.globalCompositeOperation = "lighter";
    glow(cx, cy, K * 30 * (1 + .15 * b), "255,60,140", .28 * appear);
    glow(cx, cy, K * 16, "255,160,200", .18 * appear);
    const cols = ["255,110,170", "255,170,205", "255,205,120"];
    for (let bk = 0; bk < 3; bk++) {
      g.fillStyle = "rgba(" + cols[bk] + "," + (.8 * appear).toFixed(3) + ")";
      for (let i = bk; i < this.pts.length; i += 3) {
        const p = this.pts[i];
        const x = p.x * ca + p.z * sa, z = -p.x * sa + p.z * ca;
        const f = 80 / (80 - z);
        const sx = cx + x * scale * f, sy = cy + p.y * scale * f, s = p.s * f * (1 + b * .5);
        g.fillRect(sx - s / 2, sy - s / 2, s, s);
      }
    }
    g.globalCompositeOperation = "source-over";
    const bi = Math.floor(st / 1.3);
    if (bi !== this.lastBeat) {
      this.lastBeat = bi;
      if (appear > .9) spawnRing(cx, cy, K * 14, Math.max(W, H) * .75, bi % 2 === 1);
    }
  }
},

/* 1 — Кубаныч: жылуу күн нуру, розалар, алтын жарыктар */
{
  bok: [], roses: [],
  init() {
    this.bok = Array.from({ length: LOW ? 35 : 60 }, () => ({ x: rnd(0, W), y: rnd(0, H), r: rnd(3, 14), v: rnd(8, 28), ph: rnd(0, TAU), a: rnd(.2, .6) }));
    this.roses = Array.from({ length: LOW ? 7 : 12 }, () => ({ x: rnd(0, W), y: rnd(0, H), v: rnd(14, 34), sz: rnd(24, 44), ph: rnd(0, TAU) }));
  },
  fg(st, t, dt) {
    const a = smooth(0, 2.5, st), sx = W * .8, sy = H * .16;
    g.globalCompositeOperation = "lighter";
    glow(sx, sy, Math.max(W, H) * .85, "255,190,100", .34 * a);
    glow(sx, sy, Math.min(W, H) * .22, "255,236,180", .5 * a);
    for (let k = 0; k < 9; k++) {
      const ang = t * .06 + k * TAU / 9 + .6, L = Math.max(W, H) * 1.3, w = .07;
      g.fillStyle = "rgba(255,215,140," + (.07 * a).toFixed(3) + ")";
      g.beginPath(); g.moveTo(sx, sy);
      g.lineTo(sx + Math.cos(ang - w) * L, sy + Math.sin(ang - w) * L);
      g.lineTo(sx + Math.cos(ang + w) * L, sy + Math.sin(ang + w) * L);
      g.closePath(); g.fill();
    }
    for (const b of this.bok) {
      b.y -= b.v * dt;
      if (b.y < -20) { b.y = H + 20; b.x = rnd(0, W); }
      const al = b.a * (.6 + .4 * Math.sin(t * 1.3 + b.ph)) * a;
      g.fillStyle = "rgba(255,208,120," + al.toFixed(3) + ")";
      g.beginPath(); g.arc(b.x + Math.sin(t * .5 + b.ph) * 10, b.y, b.r, 0, TAU); g.fill();
    }
    g.globalCompositeOperation = "source-over";
    g.textAlign = "center"; g.textBaseline = "middle";
    for (const r of this.roses) {
      r.y -= r.v * dt;
      if (r.y < -50) { r.y = H + 50; r.x = rnd(0, W); }
      g.save();
      g.translate(r.x + Math.sin(t * .6 + r.ph) * 24, r.y);
      g.rotate(Math.sin(t * .7 + r.ph) * .5);
      g.globalAlpha = .85 * a;
      g.font = r.sz + "px 'Segoe UI Emoji','Noto Color Emoji',serif";
      g.fillText("🌹", 0, 0);
      g.restore();
    }
    g.globalAlpha = 1;
  }
},

/* 2 — Кыйын күндөр: жамгыр, андан кийин асманда жарык */
{
  drops: [],
  init() {
    this.drops = Array.from({ length: LOW ? 160 : 260 }, () => ({ x: rnd(0, W * 1.2), y: rnd(0, H), l: rnd(10, 24), v: rnd(500, 900) }));
  },
  fg(st, t, dt) {
    const cyc = st % 26;
    const rainK = cyc < 11 ? 1 : cyc < 16 ? 1 - (cyc - 11) / 5 * .88 : cyc < 22 ? .12 : .12 + (cyc - 22) / 4 * .88;
    const lightK = smooth(10, 16, cyc) * (1 - smooth(22, 26, cyc));
    g.fillStyle = "rgba(6,10,34," + (.15 + .45 * rainK).toFixed(3) + ")";
    g.fillRect(0, 0, W, H);

    if (lightK > .01) {
      g.globalCompositeOperation = "lighter";
      glow(W / 2, -H * .05, H * 1.1, "255,225,170", .5 * lightK);
      for (let k = 0; k < 6; k++) {
        const ang = Math.PI / 2 + (k - 2.5) * .24 + Math.sin(t * .3 + k) * .03, L = H * 1.4, w = .05;
        g.fillStyle = "rgba(255,230,180," + (.10 * lightK).toFixed(3) + ")";
        g.beginPath(); g.moveTo(W / 2, -20);
        g.lineTo(W / 2 + Math.cos(ang - w) * L, -20 + Math.sin(ang - w) * L);
        g.lineTo(W / 2 + Math.cos(ang + w) * L, -20 + Math.sin(ang + w) * L);
        g.closePath(); g.fill();
      }
      const hues = [0, 30, 55, 120, 200, 270];
      g.lineWidth = 10;
      for (let j = 0; j < 6; j++) {
        g.strokeStyle = "hsla(" + hues[j] + ",90%,65%," + (.13 * lightK).toFixed(3) + ")";
        g.beginPath(); g.arc(W / 2, H * 1.05, H * .62 + j * 10, Math.PI, TAU); g.stroke();
      }
      g.globalCompositeOperation = "source-over";
    }

    const n = Math.floor(this.drops.length * (.15 + .85 * rainK));
    g.strokeStyle = "rgba(170,200,255," + (.18 + .3 * rainK).toFixed(3) + ")";
    g.lineWidth = 1.2; g.beginPath();
    for (let i = 0; i < n; i++) {
      const d = this.drops[i];
      d.y += d.v * dt; d.x -= d.v * dt * .18;
      if (d.y > H) { d.y = -20; d.x = rnd(0, W * 1.2); }
      g.moveTo(d.x, d.y); g.lineTo(d.x + d.l * .18, d.y - d.l);
    }
    g.stroke();
  }
},

/* 3 — Алыста болсок да: ай, жылдыздар, эки жарык чекит */
{
  hist: [], close: false,
  init() { this.hist = []; this.close = false; },
  fg(st, t, dt) {
    const a = smooth(0, 2.5, st);
    const mr = Math.min(W, H) * .09, mx = W * .82, my = H * .2;
    g.globalCompositeOperation = "lighter";
    glow(mx, my, mr * 3.4, "190,210,255", .2 * a);
    g.globalCompositeOperation = "source-over";
    g.globalAlpha = a;
    const mg = g.createRadialGradient(mx - mr * .3, my - mr * .3, mr * .1, mx, my, mr);
    mg.addColorStop(0, "#fffdf0"); mg.addColorStop(1, "#c9d3ee");
    g.fillStyle = mg; g.beginPath(); g.arc(mx, my, mr, 0, TAU); g.fill();
    g.fillStyle = "rgba(140,150,185,.35)";
    [[-.3, .15, .2], [.28, .3, .13], [.12, -.38, .11], [-.4, -.25, .09], [.35, -.15, .07]].forEach(c => {
      g.beginPath(); g.arc(mx + c[0] * mr, my + c[1] * mr, c[2] * mr, 0, TAU); g.fill();
    });
    g.globalAlpha = 1;

    const c = .5 - .5 * Math.cos(TAU * st / 22);
    const sep = lerp(.40, .03, smooth(0, 1, c)) * W, by = H * .4;
    const ax = W / 2 - sep, ay = by + Math.sin(t * .9) * H * .012;
    const bx = W / 2 + sep, bY = by + Math.cos(t * .8) * H * .012;
    this.hist.push([ax, ay, bx, bY]); if (this.hist.length > 50) this.hist.shift();

    g.globalCompositeOperation = "lighter";
    for (let i = 0; i < this.hist.length; i++) {
      const h = this.hist[i], u = i / this.hist.length, al = (.35 * u * a).toFixed(3);
      g.fillStyle = "rgba(255,120,190," + al + ")"; g.beginPath(); g.arc(h[0], h[1], 1 + 3 * u, 0, TAU); g.fill();
      g.fillStyle = "rgba(255,210,120," + al + ")"; g.beginPath(); g.arc(h[2], h[3], 1 + 3 * u, 0, TAU); g.fill();
    }
    const mxp = (ax + bx) / 2, myp = (ay + bY) / 2 + H * .05 * (1 - c) + Math.sin(t) * 6;
    const tg = g.createLinearGradient(ax, ay, bx, bY);
    tg.addColorStop(0, "rgb(255,120,190)"); tg.addColorStop(1, "rgb(255,210,120)");
    g.globalAlpha = (.15 + .6 * c) * a; g.strokeStyle = tg; g.lineWidth = 1.5 + 2.5 * c;
    g.beginPath(); g.moveTo(ax, ay); g.quadraticCurveTo(mxp, myp, bx, bY); g.stroke();
    g.globalAlpha = 1;
    for (let i = 0; i < 14; i++) {
      const u = (t * .1 + i / 14) % 1, q = 1 - u;
      const x = q * q * ax + 2 * q * u * mxp + u * u * bx, y = q * q * ay + 2 * q * u * myp + u * u * bY;
      g.fillStyle = "rgba(255,235,200," + ((.25 + .5 * Math.abs(Math.sin(t * 3 + i))) * a * (.4 + .6 * c)).toFixed(3) + ")";
      g.beginPath(); g.arc(x, y, 1.6, 0, TAU); g.fill();
    }
    glow(ax, ay, 34 + 10 * c, "255,120,190", .85 * a);
    glow(bx, bY, 34 + 10 * c, "255,210,120", .85 * a);
    g.fillStyle = "rgba(255,255,255," + a + ")";
    g.beginPath(); g.arc(ax, ay, 3.2, 0, TAU); g.fill();
    g.beginPath(); g.arc(bx, bY, 3.2, 0, TAU); g.fill();
    if (c > .9) {
      const bb = beatCurve(t, 1.3);
      g.globalAlpha = smooth(.9, .98, c) * a; g.fillStyle = "rgba(255,110,170,.95)";
      heartPath(g, mxp, myp - 26, 2.2 + bb * .6, 48); g.fill();
      g.globalAlpha = 1;
      if (!this.close) { this.close = true; spawnRing(mxp, myp, 10, Math.max(W, H) * .6, false); }
    } else if (c < .6) this.close = false;
    g.globalCompositeOperation = "source-over";
    shoot(dt, .004);
  }
},

/* 4 — Кемчиликтерибиз менен: эки жүрөк биригип чоң жүрөк болот */
{
  sp: [], lastBeat: -1,
  init() {
    this.sp = Array.from({ length: LOW ? 30 : 50 }, () => ({ a: rnd(0, TAU), r: rnd(.5, 1.6), sp: rnd(.2, .8), s: rnd(1, 3), ph: rnd(0, TAU) }));
    this.lastBeat = -1;
  },
  fg(st, t, dt) {
    const a = smooth(0, 2, st), base = Math.min(W, H * .62);
    const k0 = base * .0075, kB = base * .0135, cx = W / 2, cy = H * .38;
    const p = (st % 18) / 18;
    const m = p < .38 ? smooth(0, .38, p) : (p < .8 ? 1 : 1 - smooth(.8, 1, p));
    const sep = (1 - m) * W * .27, bob = Math.sin(t * 1.4) * H * .014 * (1 - m);
    const aS = (1 - smooth(.82, 1, m)) * a, aB = smooth(.82, 1, m) * a;
    const ks = lerp(k0, k0 * 1.35, m);
    glowHeart(cx - sep, cy + bob, ks, PINK, aS);
    glowHeart(cx + sep, cy - bob, ks, GOLD, aS);
    const bb = beatCurve(t, 1.3) * smooth(.9, 1, m);
    glowHeart(cx, cy, kB * (1 + .07 * bb), BIG, aB);
    if (aB > .05) {
      g.globalCompositeOperation = "lighter";
      for (const s of this.sp) {
        const ang = s.a + t * s.sp, rr = kB * s.r * 22 * (1 + .05 * bb);
        const x = cx + Math.cos(ang) * rr * 1.1, y = cy + Math.sin(ang) * rr * .9;
        g.fillStyle = "rgba(255,225,170," + (aB * (.35 + .65 * Math.abs(Math.sin(t * 2 + s.ph)))).toFixed(3) + ")";
        g.beginPath(); g.arc(x, y, s.s, 0, TAU); g.fill();
      }
      g.globalCompositeOperation = "source-over";
    }
    if (m > .97) {
      const bi = Math.floor(st / 1.3);
      if (bi !== this.lastBeat) { this.lastBeat = bi; spawnRing(cx, cy, kB * 12, Math.max(W, H) * .7, bi % 2 === 0); }
    }
  }
},

/* 5 — Каалоо: кинодогудай пейзаж, жылдыздардан жасалган жүрөк */
{
  hs: [], ff: [],
  bg(st, t, dt) {
    const gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, "#060a22"); gr.addColorStop(.45, "#1d0d45"); gr.addColorStop(.75, "#6a2268"); gr.addColorStop(1, "#ff7f8a");
    g.globalAlpha = smooth(0, 2, st); g.fillStyle = gr; g.fillRect(0, 0, W, H); g.globalAlpha = 1;
  },
  init() {
    this.hs = [];
    const n = LOW ? 110 : 160;
    for (let i = 0; i < n; i++) this.hs.push({ t: i / n * TAU, k: 1, ph: rnd(0, TAU), r: rnd(1, 2.4) });
    const m = LOW ? 40 : 70;
    for (let i = 0; i < m; i++) this.hs.push({ t: rnd(0, TAU), k: Math.sqrt(Math.random()) * .9, ph: rnd(0, TAU), r: rnd(.8, 1.8) });
    this.n = n;
    this.ff = Array.from({ length: 28 }, () => ({ x: rnd(0, W), y: rnd(H * .55, H), ph: rnd(0, TAU), sp: rnd(.3, .9) }));
  },
  mountain(base, amp, off, col, step) {
    g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W + step; x += step) {
      const y = base - amp * (.55 * Math.sin(x * .008 + off) + .3 * Math.sin(x * .019 + off * 1.7) + .15 * Math.sin(x * .043 + off * 2.3));
      g.lineTo(x, y);
    }
    g.lineTo(W, H); g.closePath(); g.fill();
  },
  fg(st, t, dt) {
    const a = smooth(0, 2, st);
    // жылдыздардан жүрөк
    const K = Math.min(W, H * .6) * .016, cx = W / 2, cy = H * .30 + Math.sin(t * .6) * 5;
    const sc = K * (1 + .03 * Math.sin(t * 1.5));
    const shown = Math.floor(this.hs.length * smooth(.5, 7, st));
    g.globalCompositeOperation = "lighter";
    glow(cx, cy, K * 26, "255,150,200", .16 * a);
    g.strokeStyle = "rgba(255,200,230," + (.25 * a).toFixed(3) + ")"; g.lineWidth = 1;
    g.beginPath();
    let first = true;
    for (let i = 0; i < Math.min(shown, this.n); i++) {
      const s = this.hs[i], x = cx + hx(s.t) * sc, y = cy + hy(s.t) * sc;
      if (first) { g.moveTo(x, y); first = false; } else g.lineTo(x, y);
    }
    g.stroke();
    for (let i = 0; i < shown; i++) {
      const s = this.hs[i], x = cx + hx(s.t) * s.k * sc, y = cy + hy(s.t) * s.k * sc;
      const al = (.5 + .5 * Math.abs(Math.sin(t * 1.4 + s.ph))) * a;
      g.fillStyle = "rgba(255,235,245," + al.toFixed(3) + ")";
      g.beginPath(); g.arc(x, y, s.r, 0, TAU); g.fill();
      if (s.r > 1.9) glow(x, y, 9, "255,170,215", .5 * al);
    }
    glow(W / 2, H * .7, H * .6, "255,140,150", .25 * a);
    g.globalCompositeOperation = "source-over";
    // тоолор
    g.globalAlpha = a;
    this.mountain(H * .66, H * .10, t * .020, "#2a1250", 10);
    this.mountain(H * .74, H * .09, t * .035 + 2, "#1b0c38", 10);
    this.mountain(H * .83, H * .07, t * .050 + 5, "#0d051f", 10);
    g.globalAlpha = 1;
    // светляктар
    g.globalCompositeOperation = "lighter";
    for (const f of this.ff) {
      const x = f.x + Math.sin(t * f.sp + f.ph) * 40, y = f.y + Math.cos(t * f.sp * .8 + f.ph) * 22;
      glow(x, y, 9, "255,220,130", (.35 + .5 * Math.abs(Math.sin(t * 1.6 + f.ph))) * a);
    }
    g.globalCompositeOperation = "source-over";
    shoot(dt, .006);
  }
},

/* 6 — Акыркы сөз: жүздөгөн жүрөк бир чоң жаркыраган жүрөккө айланат */
{
  h: [], lastBeat: -1,
  init() {
    const n = LOW ? 150 : 230; this.h = [];
    for (let i = 0; i < n; i++) {
      const outline = Math.random() < .4, t = rnd(0, TAU), k = outline ? 1 : Math.sqrt(Math.random());
      this.h.push({ x0: rnd(0, W), y0: rnd(0, H), sp: rnd(10, 34), s: rnd(.28, .7), spr: (Math.random() * 4) | 0,
        ph: rnd(0, TAU), ux: hx(t) * k, uy: hy(t) * k });
    }
    this.lastBeat = -1;
  },
  fg(st, t, dt) {
    const K = Math.min(W, H * .62) * .0185, cx = W / 2, cy = H * .38;
    const ph = st % 22;
    const c = ph < 10 ? smooth(0, 1, ph / 10) : (ph < 16 ? 1 : 1 - smooth(0, 1, (ph - 16) / 6));
    const b = beatCurve(st, 1.3) * smooth(.8, 1, c);
    g.globalCompositeOperation = "lighter";
    glow(cx, cy, K * 30 * (1 + .2 * b), "255,60,140", .35 * c);
    glow(cx, cy, K * 14, "255,190,120", .2 * c);
    for (const h of this.h) {
      const yy = (((h.y0 - st * h.sp) % H) + H) % H, xx = h.x0 + Math.sin(t * .4 + h.ph) * 18;
      const tx = cx + h.ux * K * (1 + .06 * b), ty = cy + h.uy * K * (1 + .06 * b);
      const x = lerp(xx, tx, c) + Math.sin(t * 2 + h.ph) * 1.2 * c, y = lerp(yy, ty, c);
      const w = (16 + h.s * 30) * lerp(1, .62, c);
      g.globalAlpha = (.55 + .45 * c) * (.8 + .2 * Math.sin(t * 2 + h.ph));
      g.drawImage(sprites.heart[h.spr], x - w / 2, y - w / 2, w, w);
    }
    g.globalAlpha = .6 * c; g.strokeStyle = "rgb(255,170,210)"; g.lineWidth = 2;
    heartPath(g, cx, cy, K * 1.02, 80); g.stroke();
    g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
    if (c > .95) {
      const bi = Math.floor(st / 1.3);
      if (bi !== this.lastBeat) { this.lastBeat = bi; spawnRing(cx, cy, K * 12, Math.max(W, H) * .75, bi % 2 === 0); }
    }
  }
}
];

function setEffect(i) {
  cur = i; sceneStart = performance.now(); rings.length = 0;
  if (FX[i].init) FX[i].init();
  $("tint").style.background = TINTS[i];
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  initStars(); initPetals();
  if (FX[cur].init) FX[cur].init();
  syncCtrl();
}

let lastT = performance.now(); const T0 = lastT;
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  const t = (now - T0) / 1000, st = (now - sceneStart) / 1000;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.clearRect(0, 0, W, H); g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
  const fx = FX[cur];
  if (fx.bg) fx.bg(st, t, dt);
  drawStars(t, 1);
  fx.fg(st, t, dt);
  drawRings(dt);
  updatePetals(dt, t); drawPetals();
  requestAnimationFrame(frame);
}

/* --- басканда жүрөктөр чачыроо --- */
function pop(x, y, n) {
  const set = ["❤️", "💗", "💖", "🌹", "✨", "💕"];
  for (let i = 0; i < n; i++) {
    const d = document.createElement("div");
    d.className = "pop"; d.textContent = set[Math.floor(Math.random() * set.length)];
    const a = Math.random() * TAU, dist = 60 + Math.random() * 140;
    d.style.left = x + "px"; d.style.top = y + "px";
    d.style.fontSize = (16 + Math.random() * 18) + "px";
    d.style.setProperty("--dx", Math.cos(a) * dist + "px");
    d.style.setProperty("--dy", Math.sin(a) * dist - 50 + "px");
    d.style.setProperty("--rot", (Math.random() * 360 - 180) + "deg");
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 1700);
  }
}

   БАСКЫЧТАР

let wake = null;
async function acquireWake() {
  try { if ("wakeLock" in navigator) wake = await navigator.wakeLock.request("screen"); } catch (e) {}
}

$("beginBtn").addEventListener("click", e => {
  if (S.started) return;
  S.started = true;
  ensureCtx();
  Music.start();
  acquireWake();
  $("intro").classList.add("hide");
  $("stage").hidden = false; $("controls").hidden = false; $("topbar").hidden = false;
  syncCtrl();
  pop(e.clientX, e.clientY, 14);
  if (Voice.fileAudio && Voice.userFile === false) toast("voice.mp3 табылды — «Угуу» басканда ушул үн ойнойт 🎧", 5000);
  go(0, { force: true });
});

$("prevBtn").addEventListener("click", () => go(S.idx - 1));
$("nextBtn").addEventListener("click", () => go(S.idx + 1));
$("musicBtn").addEventListener("click", () => { ensureCtx(); Music.toggle(); });

$("listenBtn").addEventListener("click", () => { if (S.started) Voice.start(S.idx); });
$("stopBtn").addEventListener("click", () => { Voice.stop(); toast("Окуу токтотулду", 1800); });
$("replayBtn").addEventListener("click", async () => {
  if (!S.started) return;
  Voice.stop();
  await waitIdle();
  if (S.idx !== 0) { await go(0); await waitIdle(); }
  Voice.start(0);
});

$("moreBtn").addEventListener("click", () => { $("more").classList.toggle("open"); setTimeout(syncCtrl, 50); });

$("musicVol").value = Math.round(Music.vol * 100);
$("voiceVol").value = Math.round(Voice.vol * 100);
$("voiceRate").value = Math.round(Voice.rate * 100);
$("musicVol").addEventListener("input", e => { Music.vol = e.target.value / 100; store.set("mvol", Music.vol); Music.apply(); });
$("voiceVol").addEventListener("input", e => {
  Voice.vol = e.target.value / 100; store.set("vvol", Voice.vol);

});
$("voiceRate").addEventListener("input", e => { Voice.rate = e.target.value / 100; store.set("vrate", Voice.rate); });

$("langBtn").addEventListener("click", () => {
  Voice.lang = Voice.lang === "ky-KG" ? "ru-RU" : "ky-KG";

});

$("voiceFileBtn").addEventListener("click", () => {

});

$("musicFileBtn").addEventListener("click", () => {
  if (Music.fileAudio) Music.detach(); else $("musicFile").click();
});
$("musicFile").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  Music.useUserFile(f); e.target.value = "";
});

$("fsBtn").addEventListener("click", () => {
  try {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  } catch (e) { toast("Толук экран бул браузерде жок."); }
});

/* свайп жана баскычтар */
let tx = 0, ty = 0;
document.addEventListener("touchstart", e => { const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; }, { passive: true });
document.addEventListener("touchend", e => {
  if (!S.started || e.target.closest("#controls") || e.target.closest("#card")) return;
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 60) go(dx < 0 ? S.idx + 1 : S.idx - 1);
}, { passive: true });
document.addEventListener("keydown", e => {
  if (!S.started) return;
  if (e.key === "ArrowRight") go(S.idx + 1);
  if (e.key === "ArrowLeft") go(S.idx - 1);
});
document.addEventListener("pointerdown", e => {
  if (!S.started || e.target.closest("#controls") || e.target.closest("#topbar")) return;
  pop(e.clientX, e.clientY, 6);
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.started) acquireWake(); });

/* =====================================================
   ИШТЕТҮҮ
   ===================================================== */
buildSprites();
buildDots();
window.addEventListener("resize", resize);
if ("ResizeObserver" in window) new ResizeObserver(syncCtrl).observe($("controls"));
resize();
setEffect(0);
refreshUI();
requestAnimationFrame(frame);

/* тышкы файлдарды фондо текшерүү (болсо — колдонулат) */
probe("romantic-music.mp3", "canplay", a => { if (!Music.fileAudio) { a.loop = true; Music.fileAudio = a; refreshUI(); } });
probe("voice.mp3", "loadedmetadata", a => { if (!Voice.fileAudio) Voice.attach(a, false); });

})();
</script>
</body>
</html>
